<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A million grains of falling sand, simulated on your GPU with WebGPU compute shaders." />
    <meta name="theme-color" content="#09090d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2309090d'/%3E%3Cpath d='M2 14h12v-3l-3-2-2 1-3-1-4 2z' fill='%23dbb36b'/%3E%3Ccircle cx='11' cy='5' r='2' fill='%23ff5c14'/%3E%3C/svg%3E" />
    <title>lume</title>
  </head>
  <body>
    <canvas id="world" aria-label="Simulation. Drag to paint with the selected material."></canvas>
    <header class="bar">
      <strong class="logo">lume</strong>
      <div id="tools" class="tools" role="toolbar" aria-label="Materials"></div>
      <label class="size">Brush <input id="size" type="range" min="2" max="60" value="12" /></label>
      <button id="pause">Pause</button>
      <button id="reset" title="Reload the opening scene (R)">Reset</button>
      <button id="clear">Clear</button>
      <span id="hud" class="hud"></span>
    </header>
    <div class="no-gpu-message" role="alert">
      <h1>lume needs WebGPU</h1>
      <p>Try a recent Chrome, Edge or Safari. Firefox supports it on some systems.</p>
      <p class="reason" id="no-gpu-reason"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
